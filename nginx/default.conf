server {
    listen 80;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 共通ヘッダー
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /static/ {
        alias /static/;
    }

    location /admin/ {
        proxy_pass http://django-web:8000/admin/;
    }

    # Next.js Route Handler（/api/ より先に書く）
    location /api/auth/ {
        proxy_pass http://nextjs-web:3000/api/auth/;
    }

    location /api/ {
        proxy_pass http://django-web:8000/api/;
    }

    location /_next/ {
        proxy_pass http://nextjs-web:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://nextjs-web:3000/;
    }
}